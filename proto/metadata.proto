syntax = "proto3";

package raft;

import "common.proto";

service MetadataService {
  rpc CreateBucket(CreateBucketRequest) returns (CreateBucketResponse);
  rpc DeleteBucket(DeleteBucketRequest) returns (DeleteBucketResponse);
  rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse);
  rpc CommitObject(CommitObjectRequest) returns (CommitObjectResponse);
  rpc AbortObject(AbortObjectRequest) returns (AbortObjectResponse);
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);
  rpc HeadObject(HeadObjectRequest) returns (HeadObjectResponse);
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
  rpc JoinMetadataCluster(JoinMetadataClusterRequest) returns (JoinMetadataClusterResponse);
}

message CreateBucketRequest {
  string request_id = 1;
  string bucket = 2;
  uint64 client_time_unix_ms = 3;
}

message CreateBucketResponse {
  MetadataResponseSummary summary = 1;
  BucketRecord bucket_record = 2;
}

message DeleteBucketRequest {
  string request_id = 1;
  string bucket = 2;
  bool if_empty = 3;
  uint64 client_time_unix_ms = 4;
}

message DeleteBucketResponse {
  MetadataResponseSummary summary = 1;
  BucketRecord bucket_record = 2;
}

message CreateObjectRequest {
  string request_id = 1;
  string bucket = 2;
  string object_key = 3;
  string object_id = 4;
  uint64 version = 5;
  uint64 size = 6;
  string etag = 7;
  uint64 client_time_unix_ms = 8;
}

message CreateObjectResponse {
  MetadataResponseSummary summary = 1;
  ObjectRecord object = 2;
}

message CommitObjectRequest {
  string request_id = 1;
  string bucket = 2;
  string object_key = 3;
  string object_id = 4;
  uint64 version = 5;
  uint64 size = 6;
  string etag = 7;
  repeated ChunkRef chunks = 8;
  uint64 client_time_unix_ms = 9;
}

message CommitObjectResponse {
  MetadataResponseSummary summary = 1;
  ObjectRecord object = 2;
}

message AbortObjectRequest {
  string request_id = 1;
  string bucket = 2;
  string object_key = 3;
  string object_id = 4;
  uint64 version = 5;
  uint64 client_time_unix_ms = 6;
}

message AbortObjectResponse {
  MetadataResponseSummary summary = 1;
  ObjectRecord object = 2;
}

message DeleteObjectRequest {
  string request_id = 1;
  string bucket = 2;
  string object_key = 3;
  string object_id = 4;
  uint64 version = 5;
  uint64 client_time_unix_ms = 6;
}

message DeleteObjectResponse {
  MetadataResponseSummary summary = 1;
  ObjectRecord object = 2;
}

message HeadObjectRequest {
  string bucket = 1;
  string object_key = 2;
  string object_id = 3;
  uint64 version = 4;
}

message HeadObjectResponse {
  MetadataResponseSummary summary = 1;
  bool found = 2;
  ObjectRecord object = 3;
}

message ListObjectsRequest {
  string bucket = 1;
  string prefix = 2;
  uint32 limit = 3;
  string continuation_token = 4;
}

message ListObjectsResponse {
  MetadataResponseSummary summary = 1;
  repeated ObjectRecord objects = 2;
  string next_continuation_token = 3;
}

enum JoinMetadataCandidateStateHint {
  JOIN_METADATA_CANDIDATE_STATE_HINT_UNSPECIFIED = 0;
  JOIN_METADATA_CANDIDATE_STATE_HINT_JOINING = 1;
  JOIN_METADATA_CANDIDATE_STATE_HINT_CANDIDATE = 2;
}

enum JoinMetadataClusterDisposition {
  JOIN_METADATA_CLUSTER_DISPOSITION_UNSPECIFIED = 0;
  JOIN_METADATA_CLUSTER_DISPOSITION_ACCEPTED_PENDING_COMMIT = 1;
  JOIN_METADATA_CLUSTER_DISPOSITION_NOT_LEADER = 2;
  JOIN_METADATA_CLUSTER_DISPOSITION_DUPLICATE = 3;
  JOIN_METADATA_CLUSTER_DISPOSITION_PENDING_MEMBERSHIP_CHANGE = 4;
  JOIN_METADATA_CLUSTER_DISPOSITION_INVALID_CANDIDATE = 5;
  JOIN_METADATA_CLUSTER_DISPOSITION_REJECTED = 6;
}

enum JoinMetadataTargetMembership {
  JOIN_METADATA_TARGET_MEMBERSHIP_UNSPECIFIED = 0;
  JOIN_METADATA_TARGET_MEMBERSHIP_LEARNER = 1;
}

message JoinMetadataClusterRequest {
  string request_id = 1;
  string cluster_id = 2;
  string node_id = 3;
  int32 candidate_raft_id = 4;
  string candidate_client_address = 5;
  string candidate_raft_address = 6;
  string candidate_incarnation_id = 7;
  uint64 candidate_sequence = 8;
  uint64 persistent_generation = 9;
  string data_dir_fingerprint = 10;
  JoinMetadataCandidateStateHint local_state_hint = 11;
  string observed_view_node_id = 12;
  uint64 observed_time_unix_ms = 13;
  string observed_metadata_endpoint = 14;
}

message JoinMetadataClusterResponse {
  MetadataResponseSummary summary = 1;
  JoinMetadataClusterDisposition disposition = 2;
  JoinMetadataTargetMembership requested_membership = 3;
  bool committed_membership_changed = 4;
  uint64 membership_epoch = 5;
  string canonical_node_id = 6;
  int32 assigned_raft_id = 7;
}
