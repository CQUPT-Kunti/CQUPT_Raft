syntax = "proto3";

package storage;

enum StorageNodeStatusCode {
  STORAGE_NODE_STATUS_CODE_UNSPECIFIED = 0;
  STORAGE_NODE_STATUS_CODE_OK = 1;
  STORAGE_NODE_STATUS_CODE_ALREADY_EXISTS = 2;
  STORAGE_NODE_STATUS_CODE_NOT_FOUND = 3;
  STORAGE_NODE_STATUS_CODE_CONFLICT = 4;
  STORAGE_NODE_STATUS_CODE_CHECKSUM_MISMATCH = 5;
  STORAGE_NODE_STATUS_CODE_CORRUPTED = 6;
  STORAGE_NODE_STATUS_CODE_DISK_FULL = 7;
  STORAGE_NODE_STATUS_CODE_PERMISSION_DENIED = 8;
  STORAGE_NODE_STATUS_CODE_IO_ERROR = 9;
  STORAGE_NODE_STATUS_CODE_TIMEOUT = 10;
  STORAGE_NODE_STATUS_CODE_CANCELLED = 11;
  STORAGE_NODE_STATUS_CODE_OVERLOADED = 12;
  STORAGE_NODE_STATUS_CODE_NODE_UNAVAILABLE = 13;
  STORAGE_NODE_STATUS_CODE_UNSUPPORTED = 14;
  STORAGE_NODE_STATUS_CODE_INVALID_ARGUMENT = 15;
}

enum StorageChecksumAlgorithm {
  STORAGE_CHECKSUM_ALGORITHM_UNSPECIFIED = 0;
  STORAGE_CHECKSUM_ALGORITHM_SHA256 = 1;
}

enum StorageChunkState {
  STORAGE_CHUNK_STATE_UNSPECIFIED = 0;
  STORAGE_CHUNK_STATE_STAGING = 1;
  STORAGE_CHUNK_STATE_LIVE = 2;
  STORAGE_CHUNK_STATE_DELETING = 3;
  STORAGE_CHUNK_STATE_DELETED = 4;
  STORAGE_CHUNK_STATE_QUARANTINED = 5;
  STORAGE_CHUNK_STATE_CORRUPTED = 6;
  STORAGE_CHUNK_STATE_MISSING = 7;
}

enum WriteChunkDurability {
  WRITE_CHUNK_DURABILITY_UNSPECIFIED = 0;
  WRITE_CHUNK_DURABILITY_PUBLISH = 1;
}

enum StorageNodeHealth {
  STORAGE_NODE_HEALTH_UNSPECIFIED = 0;
  STORAGE_NODE_HEALTH_HEALTHY = 1;
  STORAGE_NODE_HEALTH_DEGRADED = 2;
  STORAGE_NODE_HEALTH_READ_ONLY = 3;
  STORAGE_NODE_HEALTH_UNAVAILABLE = 4;
  STORAGE_NODE_HEALTH_DRAINING = 5;
}

enum StorageNodeDiskPressure {
  STORAGE_NODE_DISK_PRESSURE_UNSPECIFIED = 0;
  STORAGE_NODE_DISK_PRESSURE_LOW = 1;
  STORAGE_NODE_DISK_PRESSURE_MEDIUM = 2;
  STORAGE_NODE_DISK_PRESSURE_HIGH = 3;
  STORAGE_NODE_DISK_PRESSURE_FULL = 4;
}

enum StorageNodeLivenessState {
  STORAGE_NODE_LIVENESS_STATE_UNSPECIFIED = 0;
  STORAGE_NODE_LIVENESS_STATE_LIVE = 1;
  STORAGE_NODE_LIVENESS_STATE_STALE = 2;
  STORAGE_NODE_LIVENESS_STATE_SUSPECT = 3;
  STORAGE_NODE_LIVENESS_STATE_DEAD = 4;
}

message StorageChunkChecksum {
  StorageChecksumAlgorithm algorithm = 1;
  string value = 2;
  uint64 size_bytes = 3;
  uint64 computed_at_unix_ms = 4;
}

message StorageNodeResponseSummary {
  StorageNodeStatusCode code = 1;
  string message = 2;
  string request_id = 3;
  string node_id = 4;
  string chunk_id = 5;
  uint64 retry_after_ms = 6;
}

message StorageNodeFailureDomain {
  string zone = 1;
  string rack = 2;
}

message StorageNodeCapacityReport {
  uint64 total_capacity_bytes = 1;
  uint64 used_capacity_bytes = 2;
  uint64 available_capacity_bytes = 3;
  uint64 chunk_count = 4;
}

message StorageNodeHealthReport {
  StorageNodeHealth health = 1;
  StorageNodeDiskPressure disk_pressure = 2;
  uint64 io_error_count = 3;
  bool writable = 4;
}

message StorageNodeLoadReport {
  uint32 active_reads = 1;
  uint32 active_writes = 2;
  uint32 queued_ops = 3;
  bool write_admission_overloaded = 4;
  bool read_admission_overloaded = 5;
}

message StorageNodeFacts {
  StorageNodeCapacityReport capacity = 1;
  StorageNodeHealthReport health = 2;
  StorageNodeLoadReport load = 3;
  StorageNodeFailureDomain failure_domain = 4;
}

message StorageNodeHeartbeat {
  string node_id = 1;
  string endpoint = 2;
  uint64 sequence = 3;
  uint64 observed_at_unix_ms = 4;
  StorageNodeFacts facts = 5;
  string incarnation_id = 6;
}

message StorageNodeRegistrySnapshot {
  string node_id = 1;
  string endpoint = 2;
  uint64 last_sequence = 3;
  uint64 last_seen_unix_ms = 4;
  StorageNodeLivenessState liveness = 5;
  StorageNodeFacts facts = 6;
  string incarnation_id = 7;
}

message RegisterStorageNodeRequest {
  string request_id = 1;
  string node_id = 2;
  string endpoint = 3;
  uint64 observed_at_unix_ms = 4;
  StorageNodeFacts facts = 5;
  string incarnation_id = 6;
}

message RegisterStorageNodeResponse {
  StorageNodeResponseSummary summary = 1;
  bool created = 2;
  bool idempotent = 3;
  StorageNodeRegistrySnapshot snapshot = 4;
}

message UpdateStorageNodeHeartbeatRequest {
  string request_id = 1;
  StorageNodeHeartbeat heartbeat = 2;
}

message StorageNodeFactUpdateResponse {
  StorageNodeResponseSummary summary = 1;
  uint64 accepted_sequence = 2;
  bool applied = 3;
  bool idempotent = 4;
  bool stale_ignored = 5;
  StorageNodeRegistrySnapshot snapshot = 6;
}

message ReportHealthRequest {
  string request_id = 1;
  string node_id = 2;
  string endpoint = 3;
  uint64 sequence = 4;
  uint64 observed_at_unix_ms = 5;
  StorageNodeHealthReport health = 6;
  string incarnation_id = 7;
}

message ReportCapacityRequest {
  string request_id = 1;
  string node_id = 2;
  string endpoint = 3;
  uint64 sequence = 4;
  uint64 observed_at_unix_ms = 5;
  StorageNodeCapacityReport capacity = 6;
  string incarnation_id = 7;
}

message ReportLoadRequest {
  string request_id = 1;
  string node_id = 2;
  string endpoint = 3;
  uint64 sequence = 4;
  uint64 observed_at_unix_ms = 5;
  StorageNodeLoadReport load = 6;
  string incarnation_id = 7;
}

message WriteChunkRequest {
  string request_id = 1;
  string chunk_id = 2;
  string object_id = 3;
  uint64 version = 4;
  uint32 chunk_index = 5;
  uint64 offset = 6;
  uint64 expected_size = 7;
  StorageChunkChecksum expected_checksum = 8;
  bytes payload = 9;
  uint64 timeout_ms = 10;
  bool best_effort_cancel = 11;
  WriteChunkDurability durability = 12;
}

message WriteChunkResponse {
  StorageNodeResponseSummary summary = 1;
  uint64 size = 2;
  StorageChunkChecksum checksum = 3;
  StorageChunkState state = 4;
  bool durable = 5;
  bool already_exists = 6;
}

message ReadChunkRequest {
  string request_id = 1;
  string chunk_id = 2;
  string object_id = 3;
  uint64 version = 4;
  uint32 chunk_index = 5;
  uint64 offset = 6;
  uint64 length = 7;
  StorageChunkChecksum expected_checksum = 8;
  uint64 timeout_ms = 9;
  bool best_effort_cancel = 10;
  bool verify_checksum = 11;
}

message ReadChunkResponse {
  StorageNodeResponseSummary summary = 1;
  string chunk_id = 2;
  bytes payload = 3;
  uint64 size = 4;
  StorageChunkChecksum checksum = 5;
  StorageChunkState state = 6;
  uint64 offset = 7;
  bool complete = 8;
  bool full_read = 9;
}

message DeleteChunkRequest {
  string request_id = 1;
  string chunk_id = 2;
  string object_id = 3;
  uint64 version = 4;
  uint32 chunk_index = 5;
  StorageChunkChecksum expected_checksum = 6;
  string reason = 7;
  string metadata_boundary = 8;
  uint64 timeout_ms = 9;
  bool best_effort_cancel = 10;
}

message DeleteChunkResponse {
  StorageNodeResponseSummary summary = 1;
  string chunk_id = 2;
  uint64 size = 3;
  StorageChunkChecksum checksum = 4;
  StorageChunkState state = 5;
  bool deleted = 6;
  bool already_missing = 7;
  bool already_deleted = 8;
  bool retryable = 9;
}

message BatchDeleteChunkRequest {
  string chunk_id = 1;
  string object_id = 2;
  uint64 version = 3;
  uint32 chunk_index = 4;
  StorageChunkChecksum expected_checksum = 5;
  string reason = 6;
  string metadata_boundary = 7;
}

message BatchDeleteChunkResult {
  StorageNodeResponseSummary summary = 1;
  string chunk_id = 2;
  uint64 size = 3;
  StorageChunkChecksum checksum = 4;
  StorageChunkState state = 5;
  bool deleted = 6;
  bool already_missing = 7;
  bool already_deleted = 8;
  bool retryable = 9;
}

message BatchDeleteChunksRequest {
  string request_id = 1;
  repeated BatchDeleteChunkRequest chunks = 2;
  uint64 timeout_ms = 3;
  bool best_effort_cancel = 4;
}

message BatchDeleteChunksResponse {
  StorageNodeResponseSummary summary = 1;
  repeated BatchDeleteChunkResult results = 2;
  uint32 success_count = 3;
  uint32 idempotent_count = 4;
  uint32 retryable_failure_count = 5;
  uint32 non_retryable_failure_count = 6;
  bool partial_failure = 7;
}

message ScrubChunkRequest {
  string request_id = 1;
  string chunk_id = 2;
  string object_id = 3;
  uint64 version = 4;
  uint32 chunk_index = 5;
  uint64 expected_size = 6;
  StorageChunkChecksum expected_checksum = 7;
  uint64 timeout_ms = 8;
  bool best_effort_cancel = 9;
  bool verify_checksum = 10;
  bool quarantine_on_corruption = 11;
}

message ScrubChunkFact {
  string chunk_id = 1;
  uint64 expected_size = 2;
  uint64 observed_size = 3;
  StorageChunkChecksum expected_checksum = 4;
  StorageChunkChecksum observed_checksum = 5;
  StorageChunkState state_before = 6;
  StorageChunkState state_after = 7;
  bool checksum_verified = 8;
  bool known_corrupted = 9;
  bool known_missing = 10;
  bool quarantined = 11;
}

message ScrubChunkResult {
  ScrubChunkFact fact = 1;
  bool repair_required = 2;
  bool retryable = 3;
}

message ScrubChunkResponse {
  StorageNodeResponseSummary summary = 1;
  ScrubChunkResult result = 2;
}

message RepairChunkRequest {
  string request_id = 1;
  string chunk_id = 2;
  string object_id = 3;
  uint64 version = 4;
  uint32 chunk_index = 5;
  uint64 offset = 6;
  uint64 expected_size = 7;
  StorageChunkChecksum expected_checksum = 8;
  string source_node_id = 9;
  uint64 source_size = 10;
  StorageChunkChecksum source_checksum = 11;
  StorageChunkState source_state = 12;
  bool source_checksum_verified = 13;
  bytes payload = 14;
  uint64 timeout_ms = 15;
  bool best_effort_cancel = 16;
  WriteChunkDurability durability = 17;
}

message RepairChunkFact {
  string chunk_id = 1;
  string source_node_id = 2;
  string target_node_id = 3;
  uint64 expected_size = 4;
  uint64 observed_size = 5;
  StorageChunkChecksum expected_checksum = 6;
  StorageChunkChecksum observed_checksum = 7;
  StorageChunkState source_state = 8;
  StorageChunkState target_state = 9;
  bool source_checksum_verified = 10;
  bool source_unavailable = 11;
  bool target_durable = 12;
  bool already_exists = 13;
}

message RepairChunkResult {
  RepairChunkFact fact = 1;
  bool repaired = 2;
  bool retryable = 3;
}

message RepairChunkResponse {
  StorageNodeResponseSummary summary = 1;
  RepairChunkResult result = 2;
}

service StorageNodeService {
  rpc WriteChunk(WriteChunkRequest) returns (WriteChunkResponse);
  rpc ReadChunk(ReadChunkRequest) returns (ReadChunkResponse);
  rpc DeleteChunk(DeleteChunkRequest) returns (DeleteChunkResponse);
  rpc BatchDeleteChunks(BatchDeleteChunksRequest) returns (BatchDeleteChunksResponse);
  rpc ScrubChunk(ScrubChunkRequest) returns (ScrubChunkResponse);
  rpc RepairChunk(RepairChunkRequest) returns (RepairChunkResponse);
  rpc RegisterStorageNode(RegisterStorageNodeRequest) returns (RegisterStorageNodeResponse);
  rpc UpdateStorageNodeHeartbeat(UpdateStorageNodeHeartbeatRequest) returns (StorageNodeFactUpdateResponse);
  rpc ReportHealth(ReportHealthRequest) returns (StorageNodeFactUpdateResponse);
  rpc ReportCapacity(ReportCapacityRequest) returns (StorageNodeFactUpdateResponse);
  rpc ReportLoad(ReportLoadRequest) returns (StorageNodeFactUpdateResponse);
}
