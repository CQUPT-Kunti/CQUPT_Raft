syntax = "proto3";

package raft;

message StatusRequest {}

message PeerReplicationProgress {
  int32 peer_id = 1;
  string address = 2;
  uint64 match_index = 3;
  uint64 next_index = 4;
}

message RpcMetric {
  string name = 1;
  uint64 success_count = 2;
  uint64 failure_count = 3;
  uint64 total_latency_us = 4;
  uint64 max_latency_us = 5;
}

message MetricsSnapshot {
  uint64 propose_success_count = 1;
  uint64 propose_failure_count = 2;
  uint64 election_count = 3;
  uint64 leader_change_count = 4;
  uint64 snapshot_success_count = 5;
  uint64 snapshot_failure_count = 6;
  uint64 storage_persist_failure_count = 7;
  repeated RpcMetric rpc_metrics = 8;
}

message StatusResponse {
  int32 node_id = 1;
  string address = 2;
  string role = 3;
  uint64 term = 4;
  int32 leader_id = 5;
  string leader_address = 6;
  uint64 commit_index = 7;
  uint64 last_applied = 8;
  uint64 last_log_index = 9;
  uint64 snapshot_index = 10;
  repeated PeerReplicationProgress peers = 11;
  MetricsSnapshot metrics = 12;
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string message = 2;
  int32 node_id = 3;
  string role = 4;
  uint64 term = 5;
  int32 leader_id = 6;
}

message MetricsRequest {}

message MetricsResponse {
  int32 node_id = 1;
  string role = 2;
  uint64 term = 3;
  int32 leader_id = 4;
  string leader_address = 5;
  MetricsSnapshot metrics = 6;
}

enum MetadataStatusCode {
  METADATA_STATUS_CODE_UNSPECIFIED = 0;
  METADATA_STATUS_CODE_OK = 1;
  METADATA_STATUS_CODE_NOT_LEADER = 2;
  METADATA_STATUS_CODE_INVALID_ARGUMENT = 3;
  METADATA_STATUS_CODE_NOT_FOUND = 4;
  METADATA_STATUS_CODE_IDEMPOTENT_REPLAY = 5;
  METADATA_STATUS_CODE_IDEMPOTENCY_CONFLICT = 6;
  METADATA_STATUS_CODE_STATE_CONFLICT = 7;
  METADATA_STATUS_CODE_INTERNAL_ERROR = 8;
  METADATA_STATUS_CODE_TIMEOUT = 9;
}

enum MetadataRecordState {
  METADATA_RECORD_STATE_UNSPECIFIED = 0;
  METADATA_RECORD_STATE_PENDING = 1;
  METADATA_RECORD_STATE_COMMITTED = 2;
  METADATA_RECORD_STATE_DELETED = 3;
}

message MetadataLeaderHint {
  int32 leader_id = 1;
  string leader_address = 2;
}

message MetadataManifest {
  uint64 object_size = 1;
  uint64 chunk_size = 2;
  uint64 chunk_count = 3;
  string checksum = 4;
  repeated string mock_locations = 5;
}

message MetadataRecord {
  string object_key = 1;
  MetadataRecordState state = 2;
  MetadataManifest manifest = 3;
  string payload = 4;
  string create_request_id = 5;
  string commit_request_id = 6;
  string delete_request_id = 7;
  uint64 created_at_log_index = 8;
  uint64 committed_at_log_index = 9;
  uint64 deleted_at_log_index = 10;
  string commit_info = 11;
  string delete_info = 12;
}

message MetadataResponseSummary {
  MetadataStatusCode code = 1;
  string message = 2;
  string request_id = 3;
  string object_key = 4;
  MetadataRecordState state = 5;
  uint64 term = 6;
  uint64 log_index = 7;
  MetadataLeaderHint leader_hint = 8;
}
